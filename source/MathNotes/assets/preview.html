<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script><script src="katex/contrib/auto-render.min.js"></script>
<style>
html,body{margin:0;padding:0;background:white;overflow:hidden}#note{box-sizing:border-box;padding:12px 16px;border-left:3px solid #3977a5;background:#f5f8fb;color:#24313b;font-family:"Segoe UI",Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:normal;word-spacing:normal;font-kerning:normal;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.katex-display{margin:.65em 0;white-space:normal}.katex{white-space:normal}.katex-html{white-space:nowrap}
</style></head><body><div id="note"></div><script>
window.setNote=async function(source,width,fontSize,revision){
  const note=document.getElementById('note');note.style.width=width+'px';note.style.fontSize=fontSize+'px';
  let errors=[],normalizedCount=0;
  // Only dollar delimiters and formula payloads are normalized; Chinese prose is kept as entered.
  note.textContent=source.replace(/\uff04/g,function(){normalizedCount++;return '$';});
  renderMathInElement(note,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],trust:false,strict:'ignore',throwOnError:false,
    preProcess:function(math){return math.replace(/[\uff01-\uff5e\u3000]/g,function(character){normalizedCount++;return character==='\u3000'?' ':String.fromCharCode(character.charCodeAt(0)-0xfee0);});},
    errorCallback:function(message){errors.push(message);}});
  note.querySelectorAll('.katex-error').forEach(function(element){errors.push('公式尚未完成或语法有误：'+(element.getAttribute('title')||element.textContent).slice(0,150));});
  await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  window.chrome.webview.postMessage({type:'rendered',revision:revision,width:note.getBoundingClientRect().width,height:Math.ceil(note.getBoundingClientRect().height),ratio:window.devicePixelRatio,errors:errors,formulaCount:note.querySelectorAll('.katex').length,fractionCount:note.querySelectorAll('.mfrac').length,normalizedCount:normalizedCount});
};
window.chrome.webview.postMessage({type:'ready'});
</script></body></html>
